name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches:
      - main
    paths:
      - "sdk/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-generate:
    name: Lint, test, and verify generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: sdk/go.mod

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Check protobuf lint
        working-directory: sdk/proto
        run: buf lint
      

      - name: Generate protobuf
        working-directory: sdk/proto
        run: buf generate

      - name: Ensure generated code is committed
        run: |
          if [ -n "$(git status --porcelain -- sdk)" ]; then
            git status --short -- sdk
            echo "::error::Generated SDK files are out of date. Run Buf generation and commit the result."
            exit 1
          fi

      - name: Run gofmt check
        working-directory: sdk
        run: |
          files="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$files" ]; then
            echo "$files"
            echo "::error::Go files need gofmt."
            exit 1
          fi

      - name: Run go vet
        working-directory: sdk
        run: go vet ./...

      - name: Run tests
        working-directory: sdk
        run: go test -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: sdk

  protobuf-breaking:
    name: Check protobuf compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Check for breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          buf breaking sdk/proto \
            --against '.git#ref=origin/main,subdir=sdk/proto'

      - name: Check protobuf compatibility against previous main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit exists; skipping compatibility check."
            exit 0
          fi

          buf breaking sdk/proto \
            --against ".git#ref=${BASE_SHA},subdir=sdk/proto"

  auto-tag:
    name: Tag SDK release
    runs-on: ubuntu-latest
    needs:
      - lint-test-generate
      - protobuf-breaking
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Determine next SDK patch tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags

          latest="$(
            git tag --list 'sdk/v*' |
              grep -E '^sdk/v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [ -z "$latest" ]; then
            next="sdk/v0.1.0"
          else
            version="${latest#sdk/v}"
            IFS=. read -r major minor patch <<< "$version"
            next="sdk/v${major}.${minor}.$((patch + 1))"
          fi

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists."
            exit 1
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next SDK tag: $next"        
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
